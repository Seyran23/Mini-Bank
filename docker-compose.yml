services:
  # ─── Databases ────────────────────────────────────────────────────────────
  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-minibank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minibank}
    ports:
      - '5435:5432'
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-minibank} -d auth_db']
      interval: 5s
      timeout: 5s
      retries: 5

  accounts_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: ${POSTGRES_USER:-minibank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minibank}
    ports:
      - '5433:5432'
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-minibank} -d accounts_db']
      interval: 5s
      timeout: 5s
      retries: 5

  transfers_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfers_db
      POSTGRES_USER: ${POSTGRES_USER:-minibank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minibank}
    ports:
      - '5434:5432'
    volumes:
      - transfers_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-minibank} -d transfers_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Message broker ───────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-minibank}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-minibank}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Email (local dev) ────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI → http://localhost:8025

volumes:
  auth_db_data:
  accounts_db_data:
  transfers_db_data:
  redis_data:
  rabbitmq_data:
